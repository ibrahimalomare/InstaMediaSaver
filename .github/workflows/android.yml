name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle with Caching
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Installable Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK for Easy Download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk InstaMediaSaver-debug.apk

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstaMediaSaver-Installable-APK
          path: InstaMediaSaver-debug.apk
          if-no-files-found: error
          retention-days: 30
